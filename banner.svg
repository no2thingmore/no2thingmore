<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 280" width="1280" height="280" role="img" aria-label="no2thingmore">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1726"/>
      <stop offset="1" stop-color="#1c2a42"/>
    </linearGradient>
    <linearGradient id="org" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f99e1a"/>
      <stop offset="1" stop-color="#ffb546"/>
    </linearGradient>
    <pattern id="lines" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="skewX(-20)">
      <path d="M0 0V22" stroke="#ffffff" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>
    <clipPath id="frame"><rect width="1280" height="280" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="280" fill="url(#bg)"/>
    <rect width="1280" height="280" fill="url(#lines)"/>

    <!-- 오른쪽 사선 띠 -->
    <g transform="skewX(-20)">
      <rect x="1010" y="0" width="70" height="280" fill="url(#org)"/>
      <rect x="1100" y="0" width="26" height="280" fill="#f99e1a" fill-opacity="0.55"/>
      <rect x="1146" y="0" width="12" height="280" fill="#f99e1a" fill-opacity="0.3"/>
      <rect x="1180" y="0" width="200" height="280" fill="#ffffff" fill-opacity="0.04"/>
    </g>

    <text x="80" y="164" fill="#ffffff" font-family="Segoe UI, Arial Black, Arial, sans-serif" font-size="78" font-weight="900" font-style="italic" letter-spacing="1">no2thingmore</text>

    <!-- 아래 진행 바 -->
    <rect x="0" y="272" width="1280" height="8" fill="#ffffff" fill-opacity="0.06"/>
    <rect x="0" y="272" width="420" height="8" fill="url(#org)"/>
  </g>
</svg>
